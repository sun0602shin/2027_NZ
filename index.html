-bottom:1px solid #ebeee8;padding:13px 0}.expense:last-child{border:0}.expense b{display:block}.expense small{color:#85928a}.cover{border-radius:22px;min-height:220px;background:linear-gradient(135deg,#bfd8cd,#f3e4d4);background-size:cover;background-position:center;display:flex;align-items:end;padding:22px;color:white;text-shadow:0 1px 7px #234b4a;position:relative}.cover:before{content:'';background:linear-gradient(transparent,#243a3699);position:absolute;inset:0;border-radius:22px}.cover>*{position:relative}.cover h2{font-size:30px;margin:5px 0}.quote{font:italic 22px Georgia,serif;color:#4f7567;line-height:1.5}.timeline-note{border-left:2px solid #c6dace;padding:0 0 16px 17px;margin-left:12px;white-space:pre-wrap}.modalback{position:fixed;z-index:12;inset:0;background:#1c2d2a99;display:flex;align-items:end;justify-content:center}.modal{background:#fdfcf9;width:min(800px,100%);max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 22px 35px}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalhead h2{margin:0}.close{border:0;background:#e8eee8;border-radius:50%;width:34px;height:34px}.preview{max-width:100%;max-height:38vh;border-radius:12px;object-fit:contain;display:block;margin:10px auto}.file{display:none}.sm{font-size:12px}.danger{color:#ad5a53}.bar{height:9px;border-radius:10px;background:#e5eee7;overflow:hidden}.bar>div{height:100%;background:#478a74}.bottom{position:fixed;bottom:0;left:0;right:0;padding:13px max(16px,env(safe-area-inset-left)) calc(13px + env(safe-area-inset-bottom));background:#fbfaf5ed;backdrop-filter:blur(15px);border-top:1px solid #e2e8e1;z-index:6}.bottom>div{max-width:800px;margin:auto;display:flex;justify-content:space-between;gap:8px}.bottom button{flex:1}.hide{display:none!important}@media(min-width:750px){.photos{grid-template-columns:repeat(4,1fr)}.modalback{align-items:center}.modal{border-radius:23px;max-height:85vh}}

'use strict';
const DBNAME='tripmemo_v1';let localMode=false;const localPrefix='travel_app_fallback_';let db, trips=[], photos=[], expenses=[], notes=[], selected=null, tab='timeline';let activePhoto=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>((typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')?crypto.randomUUID():Date.now()+'_'+Math.random());const today=()=>new Date().toLocaleDateString('sv-SE');const money=(n,c='KRW')=>new Intl.NumberFormat('ko-KR',{style:'currency',currency:c||'KRW',maximumFractionDigits:c==='KRW'?0:2}).format(Number(n)||0);const dateLabel=s=>s?new Date(s+'T12:00:00').toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}):'';const isoLocal=t=>{let d=new Date(t);if(isNaN(d))return today();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
function openDB(){return new Promise((resolve,reject)=>{let req=indexedDB.open(DBNAME,1);req.onupgradeneeded=()=>{for(const name of ['trips','photos','expenses','notes'])req.result.createObjectStore(name,{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function fallbackAll(name){let items=JSON.parse(localStorage.getItem(localPrefix+name)||'[]');if(name==='photos')return items.map(p=>({...p,blob:p.dataURL?dataURLBlob(p.dataURL):null}));return items}
async function fallbackPut(name,obj){let items=JSON.parse(localStorage.getItem(localPrefix+name)||'[]');let record={...obj};if(name==='photos'&&record.blob){record.dataURL=await blobDataURL(record.blob);delete record.blob}let ix=items.findIndex(x=>x.id===obj.id);if(ix>=0)items[ix]=record;else items.push(record);localStorage.setItem(localPrefix+name,JSON.stringify(items))}
async function fallbackDel(name,id){let items=JSON.parse(localStorage.getItem(localPrefix+name)||'[]').filter(x=>x.id!==id);localStorage.setItem(localPrefix+name,JSON.stringify(items))}
function txn(name,mode='readonly'){return db.transaction(name,mode).objectStore(name)}function all(name){if(localMode)return fallbackAll(name);return new Promise((res,rej)=>{let r=txn(name).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(name,obj){if(localMode)return fallbackPut(name,obj);return new Promise((res,rej)=>{let r=txn(name,'readwrite').put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(name,id){if(localMode)return fallbackDel(name,id);return new Promise((res,rej)=>{let r=txn(name,'readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}async function reload(){[trips,photos,expenses,notes]=await Promise.all(['trips','photos','expenses','notes'].map(all));render()}
const urls=new Map();function photoURL(p){if(!p)return '';if(!p.blob)return p.dataURL||'';if(!urls.has(p.id)){try{urls.set(p.id,URL.createObjectURL(p.blob))}catch(e){console.error('photo URL error',p.id,e);return p.dataURL||''}}return urls.get(p.id)}function clearUrl(id){if(urls.has(id)){URL.revokeObjectURL(urls.get(id));urls.delete(id)}}function trip(){return trips.find(t=>t.id===selected)}function listPhoto(){return photos.filter(p=>p.tripId===selected).sort((a,b)=>a.datetime.localeCompare(b.datetime))}function listExpenses(){return expenses.filter(e=>e.tripId===selected).sort((a,b)=>b.date.localeCompare(a.date))}function listNotes(){return notes.filter(n=>n.tripId===selected).sort((a,b)=>a.date.localeCompare(b.date))}function cover(t){const selectedPhoto=photos.find(p=>p.id===t.coverId);if(selectedPhoto)return photoURL(selectedPhoto);if(t.coverData)return t.coverData;const p=photos.find(p=>p.tripId===t.id);return p?photoURL(p):''}
function render(){if(!selected||!trip())renderHome();else renderTrip();}
function renderHome(){selected=null;$('#app').innerHTML=`<section class="hero"><div class="eyebrow">YOUR TRAVEL JOURNAL</div><h1>여행의 순간을 모아<br>나만의 이야기를.</h1><p class="muted">사진이 일정이 되고, 영수증이 가계부가 되고,<br>모든 여행이 한 권의 추억으로 남아요.</p><button class="primary" onclick="newTrip()">＋ 새 여행 만들기</button></section><div class="section-title"><h2>나의 여행들</h2><span class="muted">${trips.length}개의 이야기</span></div>${trips.length?trips.slice().sort((a,b)=>b.start.localeCompare(a.start)||(Number(b.created)||0)-(Number(a.created)||0)).map(t=>`<article class="card trip" onclick="openTrip('${t.id}')"><div class="trip-cover" ${cover(t)?`style="background-image:url('${cover(t)}');background-size:cover;background-position:center"`:''}>${cover(t)?'':'✈️'}</div><div class="trip-main"><div class="tags"><span class="tag">${t.status==='done'?'추억 보관함':'여행 기록 중'}</span>${t.destination?`<span class="tag">${esc(t.destination)}</span>`:''}</div><h3>${esc(t.title)}</h3><div class="muted">${esc(t.start)}${t.end&&t.end!==t.start?' ~ '+esc(t.end):''}</div><div class="muted">사진 ${photos.filter(p=>p.tripId===t.id).length}장 · 지출 ${expenses.filter(e=>e.tripId===t.id).length}건</div></div><span style="color:#96a69a">›</span></article>`).join(''):`<div class="empty"><div class="emoji">🧳</div>첫 여행을 만들어 보세요.<br>당일치기도, 한 달 여행도 좋아요.</div>`}`;$('#bottom').innerHTML='';}
function openTrip(id){selected=id;tab='timeline';render()}function goHome(){selected=null;render()}function showTab(v){tab=v;render()}function renderTrip(){if(tab==='photos')tab='timeline';const t=trip(), pp=listPhoto(),ee=listExpenses(),nn=listNotes();let sum=ee.reduce((s,e)=>s+Number(e.amount||0),0);$('#app').innerHTML=`<div class="actions"><button class="ghost" onclick="goHome()">← 모든 여행</button><button class="ghost" onclick="editTrip()">여행 설정 ⚙</button></div><div class="cover" ${cover(t)?`style="background-image:url('${cover(t)}')"`:''}><div><div class="eyebrow" style="color:#fff">${t.status==='done'?'COMPLETED JOURNEY':'ONGOING JOURNEY'}</div><h2>${esc(t.title)}</h2><div>${esc(t.destination||'어디든')} · ${esc(t.start)}${t.end!==t.start?' ~ '+esc(t.end):''}</div></div></div><nav class="tabs">${[['timeline','📍 타임라인'],['footprints','👣 발자국'],['budget','💳 경비'],['reports','📊 지출 요약'],['story','📖 여행책']].map(([v,txt])=>`<button class="tab ${tab===v?'active':''}" onclick="showTab('${v}')">${txt}</button>`).join('')}</nav><div id="tabContent"></div>`;
let out='';if(tab==='footprints'){out=footprintsHTML(t,pp);setTimeout(drawFootprintMap,80)}else if(tab==='timeline'){
 let groups={};pp.forEach(p=>(groups[p.datetime.slice(0,10)]??=[]).push(p));nn.forEach(n=>(groups[n.date]??=[]).push(n));
 let dates=Object.keys(groups).sort();
 out=`<div class="section-title"><h2>시간 · 장소별 여행 타임라인</h2><button class="secondary" onclick="$('#photosFile').click()">＋ 사진 올리기</button><button class="secondary" onclick="autoAssignPlaces()">📍 기억한 장소 적용</button></div><p class="muted">날짜별로 촬영 시간순 정렬하고, 시간 차이가 90분 이내이면서 가까운 장소에서 찍은 사진을 자동으로 묶어요. GPS가 없으면 시간 중심으로 묶어요. 장소를 한 번 지정하면 주변 GPS 사진에도 적용할 수 있어요. 연속된 동일 장소 그룹은 자동으로 합쳐집니다.</p>${dates.map(d=>{
  let items=groups[d],dayPhotos=items.filter(x=>x.blob),dayNotes=items.filter(x=>!x.blob);
  let dayN=Math.round((new Date(d)-new Date(t.start))/86400000)+1;
  let clusters=groupPhotoMoments(dayPhotos);

function photoDistanceMeters(a,b){
 if(a.lat==null||a.lon==null||b.lat==null||b.lon==null)return null;
 const rad=Math.PI/180,lat1=a.lat*rad,lat2=b.lat*rad,dlat=(b.lat-a.lat)*rad,dlon=(b.lon-a.lon)*rad;
 const h=Math.sin(dlat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dlon/2)**2;
 return 6371000*2*Math.atan2(Math.sqrt(h),Math.sqrt(Math.max(0,1-h)));
}
function groupPhotoMoments(dayPhotos){
 const sorted=[...dayPhotos].sort((a,b)=>a.datetime.localeCompare(b.datetime));const groups=[];
 for(const p of sorted){const g=groups[groups.length-1];if(!g||p.splitBefore){groups.push([p]);continue;}
  const prev=g[g.length-1],distance=photoDistanceMeters(prev,p),ms=Date.parse(p.datetime)-Date.parse(prev.datetime);
  const namedA=(prev.place||'').trim(),namedB=(p.place||'').trim();
  const identical=!!namedA&&namedA===namedB;
  const conflict=!!namedA&&!!namedB&&namedA!==namedB;
  const nearby=distance==null||distance<=350;
  const shortGap=Number.isFinite(ms)&&ms>=0&&ms<=90*60000;
  if(!conflict&&(identical||(shortGap&&nearby)))g.push(p);else groups.push([p]);
 }
 return groups;
}

 }return best?.rule||null}
async function applyPlaceLearning(origin,name,radius=150){
 if(!name||origin.lat==null||origin.lon==null)return 0;
 // Always read the latest saved values. Older in-memory photos can overwrite manual edits.
 const savedTrips=await all('trips');
 const currentTrip=savedTrips.find(t=>t.id===selected);
 if(!currentTrip)throw new Error('여행 정보를 찾을 수 없습니다');
 const rules=(currentTrip.placeRules||[]).filter(r=>r.name!==name||photoDistanceMeters(r,origin)>30);
 rules.push({name,lat:origin.lat,lon:origin.lon,radius});
 await put('trips',{...currentTrip,placeRules:rules});
 let changed=0;
 const freshPhotos=(await all('photos')).filter(p=>p.tripId===selected);
 for(const p of freshPhotos){
  if(p.placeSource==='manual')continue;
  const dist=photoDistanceMeters(p,origin);
  if(dist!=null&&dist<=radius&&(!p.place||p.placeSource==='auto')&&p.blob){
   await patchPhotoFields(p.id,{place:name,placeSource:'auto'});changed++;
  }
 }
 return changed;
}

function newTrip(){tripForm()}function editTrip(){tripForm(trip())}async function saveTrip(ev,id){ev.preventDefault();let f=formData();f.exchangeRate=f.currency==='KRW'?1:Number(f.exchangeRate||0);if(f.currency!=='KRW'&&!(f.exchangeRate>0)){alert('현지 통화 기준 환율을 입력해 주세요.');return}if(!tripBudgetConfirmed&&[...document.querySelectorAll('#tripBudgetRows .trip-budget-amount')].some(x=>budgetAmountValue(x.value)>0)){alert('카테고리별 예산을 확정해 주세요.');document.querySelector('#tripBudgetRows')?.closest('details')?.setAttribute('open','');return}f.categoryBudgets={};f.categoryBudgetCurrencies={};document.querySelectorAll('#tripBudgetRows .budget-edit-row').forEach(row=>{const key=row.querySelector('.trip-budget-name').value.trim(),amount=budgetAmountValue(row.querySelector('.trip-budget-amount').value);if(key){f.categoryBudgets[key]=(f.categoryBudgets[key]||0)+Math.max(0,amount);f.categoryBudgetCurrencies[key]=row.querySelector('.trip-budget-currency')?.value||f.currency}});f.paymentMethods=[...new Set([...document.querySelectorAll('#paymentRows .payment-name')].map(x=>x.value.trim()).filter(Boolean))];if(f.end<f.start){alert('종료일이 시작일보다 빠릅니다.');return}let coverData=null;await put('trips',{...trips.find(x=>x.id===id),...f,...(coverData?{coverData}:{}),id:id||uid(),status:trips.find(x=>x.id===id)?.status||'active',created:trips.find(x=>x.id===id)?.created||Date.now()});closeAllModals();if(!id){let x=await all('trips');selected=x.find(t=>t.title===f.title&&t.start===f.start)?.id||null}await reload()}async function saveTripSettingsThenBudget(){const form=document.getElementById('editor');if(!form)return;const valid=form.reportValidity();if(!valid)return;form.requestSubmit();setTimeout(()=>{if(selected)editCategoryBudget()},450)}

async function ensureExifr(){if(window.exifr)return true;try{await loadScript('https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/full.umd.js');return !!window.exifr}catch{return false}}function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function compressPhoto(file,maxSide=1920,quality=.82){
 const bitmap=await createImageBitmap(file,{imageOrientation:'from-image'});
 try{
  const scale=Math.min(1,maxSide/Math.max(bitmap.width,bitmap.height));
  const w=Math.max(1,Math.round(bitmap.width*scale)),h=Math.max(1,Math.round(bitmap.height*scale));
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{alpha:false});if(!ctx)throw new Error('사진 처리 메모리가 부족합니다');
  ctx.drawImage(bitmap,0,0,w,h);
  return await new Promise((resolve,reject)=>canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('사진 압축 실패')),'image/jpeg',quality));
 }finally{bitmap.close?.()}
}
async function signature(file){const data=await file.slice(0,65536).arrayBuffer();let h=2166136261;for(let b of new Uint8Array(data)){h^=b;h=Math.imul(h,16777619)}return file.size+':'+(h>>>0).toString(36)}
async function onPhotos(files){
 if(!selected||!files.length)return;
 const tripAtStart=selected;
 const list=Array.from(files).filter(f=>f.type.startsWith('image/'));
 if(!list.length)return;
 const input=document.getElementById('photosFile');
 if(input)input.disabled=true;
 let overlay=document.getElementById('photoUploadOverlay');
 if(!overlay){
  overlay=document.createElement('div');overlay.id='photoUploadOverlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:99999;background:rgba(20,39,33,.62);display:flex;align-items:center;justify-content:center;padding:22px;';
  overlay.innerHTML='<section role="status" aria-live="polite" style="background:#fff;border-radius:20px;padding:25px;width:min(100%,420px);box-shadow:0 20px 65px #0004"><div style="font-weight:700;font-size:19px;margin-bottom:13px">압축 사진을 여행에 추가하는 중</div><div id="uploadCount" style="font-weight:600;margin-bottom:12px">준비 중...</div><div style="height:12px;border-radius:99px;background:#e3eae4;overflow:hidden"><div id="uploadBar" style="height:100%;width:0%;background:#2e6254;transition:width .18s"></div></div><div id="uploadPercent" style="margin-top:10px;color:#61746a;font-size:13px">0% 완료</div><p style="font-size:12px;color:#819087;margin-top:17px">완료될 때까지 이 화면을 유지해 주세요.</p></section>';
  document.body.appendChild(overlay);
 }
 let count=0,failed=0,skipped=0,can=false;const known=new Set(photos.filter(x=>x.tripId===tripAtStart).map(x=>x.signature).filter(Boolean));
 const update=()=>{const pct=Math.round((count+failed+skipped)/list.length*100);const a=document.getElementById('uploadCount'),b=document.getElementById('uploadBar'),c=document.getElementById('uploadPercent');if(a)a.textContent=(count+failed+skipped)+' / '+list.length+'장 처리 · 저장 '+count+'장'+(skipped?' · 중복 '+skipped+'장':'')+(failed?' · 실패 '+failed+'장':'');if(b)b.style.width=pct+'%';if(c)c.textContent=pct+'% 완료';};
 const pause=()=>new Promise(resolve=>setTimeout(resolve,0));
 try{
  update();await pause();
  can=await ensureExifr();
  for(const file of list){
   try{
    let meta={};
    if(can)try{meta=await exifr.parse(file,{tiff:true,exif:true,gps:true,icc:false,xmp:false,iptc:false})||{}}catch{}
    let taken=meta.DateTimeOriginal||meta.CreateDate||meta.ModifyDate||file.lastModified;
    let d=new Date(taken);if(isNaN(d))d=new Date(file.lastModified);
    let dt=isoLocal(d)+'T'+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    let lat=Number.isFinite(meta.latitude)?meta.latitude:null,lon=Number.isFinite(meta.longitude)?meta.longitude:null;
    const sig=await signature(file);if(known.has(sig)){skipped++;}else{const optimized=await compressPhoto(file);const remembered=nearestRule({lat,lon});await put('photos',{id:uid(),tripId:tripAtStart,blob:optimized,filename:file.name,signature:sig,originalSize:file.size,datetime:dt,place:remembered?.name||'',placeSource:remembered?'auto':null,lat,lon,caption:'',added:Date.now()});known.add(sig);count++;}
   }catch(error){failed++;console.error('Photo save failed:',file.name,error)}
   update();await pause();
  }
 }catch(error){console.error('Photo upload error',error);alert('사진 처리 중 문제가 발생했어요. 저장된 사진은 유지됩니다.')}
 finally{
  overlay.remove();if(input){input.disabled=false;input.value='';}
  try{await reload()}catch(error){console.error(error)}
 }
 alert(count+'장의 압축 사진을 여행에 추가했어요.'+(skipped?' 중복 '+skipped+'장은 건너뛰었어요.':'')+(failed?' '+failed+'장은 저장에 실패했어요. 저장 공간을 확인해 주세요.':'')+(!can?' 사진의 촬영 정보를 읽지 못한 경우 파일 날짜를 사용했어요.':''));
}

function expenseForm(e={}){pendingReceipts=[...(e.receipts||[])];const t=trip();const cats=[...new Set([...DEFAULT_CATS,...Object.keys(t.categoryBudgets||{}),...expenses.filter(x=>x.tripId===selected).map(x=>x.category)])];modal(e.id?'지출 수정':'여행 지출',`<div class="receipt-pinned"><div style="display:grid;gap:10px" id="receiptImages">${receiptThumbs(pendingReceipts)}</div><div class="actions"><button type="button" class="primary" onclick="retryReceipt()">🔎 영수증 인식하기</button><button type="button" class="secondary" onclick="document.getElementById('extraReceiptFile').click()">＋ 영수증 사진 첨부</button><button type="button" class="ghost" onclick="removeLastReceipt()">마지막 영수증 제거</button></div><input id="extraReceiptFile" type="file" accept="image/*" multiple style="display:none" onchange="addReceiptFiles(this.files)"></div><div class="receipt-scroll"><form class="form" id="editor" onsubmit="saveExpense(event,'${e.id||''}')"><div class="grid2"><div><label>날짜</label><input type="date" name="date" required value="${esc(e.date||expenseDay||today())}"></div><div><label>시간</label><input type="time" name="time" value="${esc(e.time||(!e.id?new Date().toTimeString().slice(0,5):''))}"></div></div><label>장소 / 가게명</label><input name="place" placeholder="예: Countdown 마트" value="${esc(e.place||'')}"><label>지출 내역 (직접 입력)</label><input name="description" placeholder="예: 점심 식사, 렌터카 주유, 기념품" value="${esc(e.description||'')}"><div class="grid2"><div><label>금액 *</label><input type="number" step="0.01" min="0" inputmode="decimal" name="amount" required value="${esc(e.amount||'')}" oninput="refreshExpenseConversion()"></div><div><label>카테고리</label><select name="category">${cats.map(c=>`<option ${e.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div></div><label>결제 통화</label><select name="currency" onchange="changeExpenseCurrency()">${currencySelectOptions(t,e.id?expenseCurrency(e,t):(t.lastExpenseCurrency||localCurrency(t)))}</select><div id="expenseRateRow"><label>적용 환율 (현지통화 1단위당 원)</label><input name="appliedRate" type="number" min="0" step="any" value="${e.id?expenseRate(e,t):baseRate(t)}" oninput="refreshExpenseConversion()"></div><div class="notice" id="expenseKRWPreview">예산 반영액: 계산 중</div><label>결제 수단</label><div style="display:flex;gap:8px"><select name="paymentMethod" style="flex:1;min-width:0">${['',...paymentMethods(t)].map(m=>`<option value="${esc(m)}" ${m===(e.paymentMethod||'')?'selected':''}>${esc(m||'선택 안 함')}</option>`).join('')}</select><button type="button" class="secondary" onclick="quickAddPayment()">＋ 추가</button></div><label>메모 (선택)</label><textarea name="detail" placeholder="추가로 남길 내용">${esc(e.detail||'')}</textarea><div class="actions"><button class="primary">영수증과 지출 저장</button>${e.id?`<button type="button" class="ghost danger" onclick="deleteExpense('${e.id}')">삭제</button>`:''}</div></form></div>`);document.querySelector('.modal')?.classList.add('receipt-editor');refreshExpenseConversion()}
function refreshReceiptImages(){const el=document.getElementById('receiptImages');if(el)el.innerHTML=receiptThumbs(pendingReceipts)}

async function addReceiptFiles(files){for(const file of [...files]){lastReceiptFile=file;try{pendingReceipts.push(await blobDataURL(await compressPhoto(file,1600,.80)))}catch(e){alert('영수증 저장 준비 실패: '+e.message)}}refreshReceiptImages()}
async function quickAddPayment(){const name=prompt('새 결제 수단 이름 (예: 현대카드, 현금)');if(!name?.trim())return;const t=trip(),methods=[...new Set([...(t.paymentMethods||DEFAULT_PAYMENTS),name.trim()])];try{await put('trips',{...t,paymentMethods:methods});const sel=document.querySelector('#editor [name="paymentMethod"]');if(sel){sel.add(new Option(name.trim(),name.trim()));sel.value=name.trim()}await reloadTripCacheOnly()}catch(e){alert('결제 수단 저장 실패: '+e.message)}}
async function reloadTripCacheOnly(){trips=await all('trips')}
function newExpense(){expenseForm()}
function editExpense(id){expenseForm(expenses.find(x=>x.id===id))}
async function saveExpense(ev,id){ev.preventDefault();const entryId=id||uid(),f=formData(),t=trip(),c=f.currency||localCurrency(t),rate=c==='KRW'?1:Number(f.appliedRate||0);if(c!=='KRW'&&!(rate>0)){alert('외화 지출의 환율을 입력해 주세요.');return}const day=f.date;await taskProgress('지출 저장 중','영수증과 지출 기록 보관');try{await put('expenses',{...expenses.find(x=>x.id===id),...f,currency:c,appliedRate:rate,receipts:[...pendingReceipts],id:entryId,tripId:selected});if(!id)await put('trips',{...t,lastExpenseCurrency:c});lastSavedExpenseId=entryId;lastSavedExpenseDate=day;expenseDay=day}catch(e){alert('저장 실패: '+e.message);return}finally{stopTaskProgress()}closeAllModals();tab='budget';await reload();setTimeout(()=>document.querySelector('.expense-new')?.scrollIntoView({behavior:'smooth',block:'center'}),80)}
async function deleteExpense(id){if(!confirm('지출과 첨부 영수증을 삭제할까요?'))return;await del('expenses',id);closeModal();await reload()}
function parseReceiptText(text){const lines=text.split(/\n/).map(x=>x.trim()).filter(Boolean);const candidates=[];const symbols=/[¥￥₩$€£]/;for(const line of lines){const matches=[...line.matchAll(/(?:[¥￥₩$€£]\s*)?\d{1,3}(?:[,\s]\d{3})+(?:\.\d{1,2})?|[¥￥₩$€£]\s*\d{2,7}|\b\d{2,7}(?:\.\d{1,2})?\b/g)];for(const m of matches){let amount=Number(m[0].replace(/[¥￥₩$€£,\s]/g,''));if(!Number.isFinite(amount)||amount<1||amount>1e8)continue;let score=0;if(/合\s*計|総\s*合\s*計|お買上|領収金額|お支払|TOTAL|AMOUNT\s*PAID|결제금액|합계|총액/i.test(line))score+=20;if(/小計|内税|消費税|税額|TAX|SUBTOTAL|CHANGE|거스름돈|소계/i.test(line))score-=18;if(symbols.test(m[0]))score+=3;if(/クレジット|CREDIT|カード/i.test(line))score+=4;if(amount>=100)score+=1;candidates.push({amount,line,score})}}candidates.sort((a,b)=>b.score-a.score||b.amount-a.amount);const first=lines.slice(0,9);let name=first.find(x=>/カフェ|レストラン|ショップ|珈琲|ホテル|CAFE|RESTAURANT|DISNEY|디즈니/i.test(x)&&!/WWW|HTTPS/i.test(x))||first.find(x=>/[ぁ-んァ-ン一-龯가-힣A-Za-z]{3,}/.test(x)&&!/WWW|HTTPS|領収|レシート|RECEIPT|合計|TOTAL/i.test(x))||'';if(first.some(x=>/カフェ[・･]?オーリンズ|カフェ.?オーリンズ/.test(x)))name='カフェ・オーリンズ (Cafe Orleans)';let date=null,time=null;const ds=text.match(/(20\d{2})\s*[年\/.-]\s*(\d{1,2})\s*[月\/.-]\s*(\d{1,2})/);if(ds)date=ds[1]+'-'+ds[2].padStart(2,'0')+'-'+ds[3].padStart(2,'0');const ts=text.match(/(?:^|\s)([01]?\d|2[0-3]):([0-5]\d)(?:\s|$)/m);if(ts)time=ts[1].padStart(2,'0')+':'+ts[2];const currency=/[¥￥]|ディズニー|カフェ・オーリンズ/.test(text)?'JPY':/[₩]|원|합계/.test(text)?'KRW':/[€]/.test(text)?'EUR':/[£]/.test(text)?'GBP':/[\$]/.test(text)?'USD':null;return {name,amount:candidates[0]?.amount||null,candidates:[...new Set(candidates.map(c=>c.amount))].slice(0,8),date,time,currency,raw:text}}
let lastReceiptFile=null;
async function retryReceipt(){if(lastReceiptFile)await recognizeReceipt(lastReceiptFile);else alert('먼저 영수증 사진을 첨부해 주세요.')}
async function onReceipt(file){if(!file)return;lastReceiptFile=file;expenseForm({date:today()});await addReceiptFiles([file]);const f=document.getElementById('editor');if(f)f.insertAdjacentHTML('afterbegin','<div class="notice" id="ocrStatus">영수증 이미지가 첨부됐어요. ‘영수증 인식하기’를 누르거나 직접 입력해 주세요.</div>');const rf=document.getElementById('receiptFile');if(rf)rf.value=''}
async function recognizeReceipt(file){if(!document.getElementById('ocrStatus'))document.getElementById('editor')?.insertAdjacentHTML('afterbegin','<div class="notice" id="ocrStatus">문자를 읽고 있어요...</div>');await taskProgress('영수증 자동 인식','인식 엔진 로딩 중');let worker;try{if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');await taskProgress('영수증 자동 인식','일본어·한국어·영어 학습 데이터 준비 중');worker=await Tesseract.createWorker('jpn+kor+eng');await taskProgress('영수증 자동 인식','영수증 문자 읽는 중');const result=await worker.recognize(file);await taskProgress('영수증 자동 인식','상호명과 합계 분석 중');const data=parseReceiptText(result.data.text||'');const form=document.getElementById('editor');if(!form)return;if(data.name)form.elements.place.value=data.name;if(data.amount)form.elements.amount.value=data.amount;if(data.date)form.elements.date.value=data.date;if(data.currency&&form.elements.currency)form.elements.currency.value=data.currency;const note=document.getElementById('ocrStatus');if(note){note.textContent=(data.amount||data.name)?'인식 결과를 확인하고 영수증 이미지와 함께 저장하세요.':'문자 인식은 끝났지만 상호명·금액을 찾지 못했어요. 직접 입력하거나 다시 인식해 주세요.';note.insertAdjacentHTML('beforeend','<div style="margin-top:8px">'+(data.currency?'추정 통화: '+data.currency+' · ':'')+(data.time?'결제 시간: '+data.time:'')+'</div><button type="button" class="secondary" onclick="retryReceipt()">↻ 다시 인식</button>'+ (data.candidates.length?'<div>금액 후보: '+data.candidates.map(n=>`<button type="button" class="ghost" onclick="document.getElementById(\'editor\').elements.amount.value=${n}">${n.toLocaleString()}</button>`).join('')+'</div>':''));}if(data.currency&&data.currency!==(trip()?.currency||'KRW')){note?.insertAdjacentHTML('beforeend',`<div class="notice">이 영수증은 ${data.currency}로 추정돼요. 현재 여행 기준 통화는 ${trip()?.currency||'KRW'}입니다. 환율 자동 변환 없이 그대로 합산하면 안 되므로 통화를 확인하세요.</div>`)}}catch(e){console.warn('OCR failed',e);const note=document.getElementById('ocrStatus');if(note)note.innerHTML='자동 인식 실패: '+esc(e.message||String(e))+'<br>이미지는 유지돼요. 직접 입력하거나 <button type="button" class="secondary" onclick="retryReceipt()">↻ 다시 인식</button>'; }finally{try{await worker?.terminate()}catch{}stopTaskProgress()}}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),60000)}
// v2.3 currency compatibility: legacy amounts and category budgets retain original trip currency.
function localCurrency(t){return t.currency||'KRW'}
function baseRate(t){return localCurrency(t)==='KRW'?1:Number(t.exchangeRate||0)}
function expenseCurrency(e,t){return e.currency||localCurrency(t)}
function expenseRate(e,t){return expenseCurrency(e,t)==='KRW'?1:Number(e.appliedRate??baseRate(t))}
function expenseKRW(e,t){return Number(e.amount||0)*expenseRate(e,t)}
function categoryCurrency(t,name){return t.categoryBudgetCurrencies?.[name]||localCurrency(t)}
function categoryKRW(t,name){const c=categoryCurrency(t,name);return Number(t.categoryBudgets?.[name]||0)*(c==='KRW'?1:baseRate(t))}
function budgetKRW(t){return Object.keys(t.categoryBudgets||{}).reduce((a,n)=>a+categoryKRW(t,n),0)}
function expensesKRW(ee,t){return ee.reduce((a,e)=>a+expenseKRW(e,t),0)}
function moneyKRW(v){return money(Math.round(v),'KRW')}
function currencySelectOptions(t,selected){return [...new Set(['KRW',localCurrency(t)])].map(c=>`<option value="${c}" ${selected===c?'selected':''}>${c}</option>`).join('')}
function budgetCurrencySelect(t,name){const c=categoryCurrency(t,name);return `<select class="trip-budget-currency" aria-label="예산 통화" onchange="refreshTripBudgetTotal();markTripBudgetDirty()">${currencySelectOptions(t,c)}</select>`}
function refreshExpenseConversion(){const f=document.querySelector('#editor');if(!f)return;const t=trip(),cur=f.querySelector('[name=currency]')?.value||localCurrency(t),rate=f.querySelector('[name=appliedRate]'),row=document.getElementById('expenseRateRow'),amount=Number(f.querySelector('[name=amount]')?.value||0),preview=document.getElementById('expenseKRWPreview');if(row)row.style.display=cur==='KRW'?'none':'block';if(rate&&cur==='KRW')rate.value='1';if(preview)preview.textContent='예산 반영액: '+moneyKRW(amount*(cur==='KRW'?1:Number(rate?.value||0)))}
function changeExpenseCurrency(){const f=document.querySelector('#editor'),c=f?.querySelector('[name=currency]')?.value,r=f?.querySelector('[name=appliedRate]');if(r)r.value=c==='KRW'?1:baseRate(trip());refreshExpenseConversion()}
function expenseDisplay(e,t){const c=expenseCurrency(e,t);return `<span style="display:block;white-space:nowrap">${money(e.amount,c)}</span>${c!=='KRW'?`<small class="muted" style="display:block;text-align:right;white-space:nowrap">≈ ${moneyKRW(expenseKRW(e,t))}</small>`:''}`}

function summaryCards(t,ee){
 const budget=budgetKRW(t),spent=expensesKRW(ee,t),pct=budget?spent/budget*100:0,c=localCurrency(t);
 const original=ee.filter(e=>expenseCurrency(e,t)===c&&c!=='KRW');
 const foreignTotal=original.reduce((a,e)=>a+Number(e.amount||0),0);
 const item=(name,v)=>`<div class="summary-mini"><span class="summary-label">${name}</span><span class="summary-value">${moneyKRW(v)}</span></div>`;
 return `<div class="summary-grid">${item('총예산',budget)}${item('남은 예산',budget-spent)}</div><div class="summary-spend"><div class="summary-spend-row"><div class="summary-spend-main"><span class="summary-label">누적 지출 <span class="expense-count">총 ${ee.length.toLocaleString('ko-KR')}건</span></span><span class="summary-spend-value">${moneyKRW(spent)}</span>${c!=='KRW'?`<span class="summary-krw">${esc(c)} 입력 합계 ${money(foreignTotal,c)} · ${original.length}건 (참고)</span>`:''}</div><div><div class="summary-pct" ${pct>100?'style="color:#c43c3c"':''}>${budget?pct.toFixed(1)+'%':'—'}</div><span class="summary-label">총예산 대비 지출</span></div></div><div class="progress-track"><div class="progress-fill ${pct>100?'over':''}" style="width:${Math.max(0,Math.min(100,pct))}%"></div></div>${pct>100?`<div class="muted" style="color:#c43c3c;margin-top:7px">예산 ${moneyKRW(spent-budget)} 초과</div>`:''}</div>`;
}
function renderExpenseReport(t,ee){
 const c='KRW',rate=baseRate(t),total=expensesKRW(ee,t),budget=budgetKRW(t);
 const krw=v=>c==='KRW'?'':rate>0?`<div style="font-size:12px;color:#758a7b;margin-top:4px">≈ ₩${Math.round(v*rate).toLocaleString('ko-KR')}</div>`:'<div class="muted">환율 미설정</div>';
 const group=key=>{const map={};for(const e of ee){const k=key(e)||'미지정';map[k]=(map[k]||0)+expenseKRW(e,t)}return Object.entries(map).sort((a,b)=>b[1]-a[1])};
 const cats=group(e=>e.category),payments=group(e=>e.paymentMethod),days=group(e=>e.date).sort((a,b)=>a[0].localeCompare(b[0]));
 const pie=entries=>{if(!entries.length||!total)return '<p class="muted">지출이 없어요.</p>';const colors=['#467b69','#dfb776','#8fa3c9','#d78d83','#927fa6','#7daba8','#ca9f6c'];let pos=0;const stops=entries.map(([k,v],i)=>{const st=pos;pos+=v/total*360;return `${colors[i%colors.length]} ${st}deg ${pos}deg`}).join(',');return `<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="height:154px;width:154px;border-radius:50%;flex:none;background:conic-gradient(${stops})"></div><div style="min-width:130px;flex:1">${entries.map(([k,v],i)=>`<div style="font-size:12px;margin:7px 0"><span style="display:inline-block;width:9px;height:9px;margin-right:5px;background:${colors[i%colors.length]}"></span>${esc(k)} · ${(v/total*100).toFixed(1)}% <b>${money(v,c)}</b></div>`).join('')}</div></div>`};
 const max=Math.max(1,...days.map(x=>x[1]));const daily=days.map(([day,v])=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><span>${esc(day)}</span><b>${money(v,c)}</b></div><div class="bar"><div style="width:${v/max*100}%"></div></div></div>`).join('')||'<p class="muted">지출 내역이 없어요.</p>';
 const bycat=Object.entries(t.categoryBudgets||{});const usedByCat=Object.fromEntries(cats);const catRows=[...new Set([...bycat.map(([k])=>k),...cats.map(([k])=>k)])].map(name=>{const b=categoryKRW(t,name),v=Number(usedByCat[name]||0),pct=b?v/b*100:0;return `<div style="margin:14px 0"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(name)}</b><span class="muted">${b?pct.toFixed(1)+'%':'예산 미설정'}</span></div><div class="muted" style="display:flex;justify-content:space-between;gap:8px"><span>지출 ${money(v,c)}</span><span>예산 ${money(b,c)}</span></div><div class="progress-track"><div class="progress-fill ${b&&v>b?'over':''}" style="width:${b?Math.min(100,pct):0}%"></div></div><div class="muted" style="color:${b&&v>b?'#c43c3c':'#758a7b'}">${b?(v>b?money(v-b,c)+' 초과':money(b-v,c)+' 남음'):v?'예산을 설정해 주세요':'—'}</div></div>`}).join('')||'<p class="muted">설정된 예산과 지출이 없어요.</p>';
 return `<div class="section-title"><h2>📊 지출 요약</h2><small>KRW 기준 · ${esc(localCurrency(t))} 환율 ${rate.toLocaleString('ko-KR')}</small></div>${summaryCards(t,ee)}<div class="card"><h3>카테고리별 예산 대비 지출</h3>${catRows}</div><div class="card"><h3>카테고리별 지출</h3>${pie(cats)}</div><div class="card"><h3>결제 수단별 지출</h3>${pie(payments)}</div><div class="card"><h3>일자별 지출</h3>${daily}</div><div class="card"><h3>↓ 데이터 내보내기</h3><p class="muted">이 여행의 전체 지출 기록과 영수증을 별도로 저장할 수 있어요.</p><div class="actions"><button class="secondary" onclick="exportCSV()">📄 전체 지출 CSV 다운로드</button><button class="secondary" onclick="receiptExportDialog()">🧾 영수증 ZIP 다운로드 · 공유</button></div></div>`;
}
function exportCSV(){const t=trip();let rows=[['날짜','시간','장소','지출 내역','카테고리','원금','원금 통화','적용 환율 (원)','KRW 환산액','결제 수단','메모'],...listExpenses().map(e=>[e.date,e.time||'',e.place,e.description||'',e.category,e.amount,expenseCurrency(e,t),expenseRate(e,t),Math.round(expenseKRW(e,t)),e.paymentMethod||'',e.detail||''])];let s='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([s],{type:'application/octet-stream'}),`${t.title}_전체지출.csv`)}
async function blobDataURL(b){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
async function exportBook(){
 const t=trip(),pp=listPhoto(),nn=listNotes(),ee=listExpenses(),btn=typeof event!=='undefined'?event?.target:null;if(btn)btn.disabled=true;

function fpValid(p){return Number.isFinite(Number(p.lat))&&Number.isFinite(Number(p.lon))&&p.lat!=null&&p.lon!=null&&Math.abs(Number(p.lat))<=90&&Math.abs(Number(p.lon))<=180}

 for(const day of days){
  const moments=groupPhotoMoments(chosen.filter(p=>fpDate(p)===day));
  for(const moment of moments){
   const named=moment.filter(p=>nameOf(p));
   const name=named.length?nameOf(named[0]):'';
   const anchor=moment.find(fpValid)||(name?geo.find(p=>nameOf(p)===name):null);
   if(!anchor)continue;
   let group=null;
   if(name)group=namedGroups.get(name)||null;
   if(!group&&!name)group=groups.find(g=>g.auto&&photoDistanceMeters(g,anchor)<=1000);
   if(!group){
    group={id:anchor.id,lat:Number(anchor.lat),lon:Number(anchor.lon),name:name||'GPS 위치',photos:[],auto:!name};
    groups.push(group);if(name)namedGroups.set(name,group);
   }
   for(const photo of moment)if(!group.photos.some(p=>p.id===photo.id))group.photos.push(photo);
  }
 }
 for(const photo of chosen){
  if(fpValid(photo)||!nameOf(photo))continue;
  const group=namedGroups.get(nameOf(photo));
  if(group&&!group.photos.some(p=>p.id===photo.id))group.photos.push(photo);

}

function fpLoadLeaflet(){if(window.L)return Promise.resolve();if(window.fpLeafletPromise)return window.fpLeafletPromise;window.fpLeafletPromise=new Promise((resolve,reject)=>{if(!document.querySelector('link[data-fp-leaflet]')){const l=document.createElement('link');l.rel='stylesheet';l.dataset.fpLeaflet='1';l.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.appendChild(l)}const script=document.createElement('script');script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.onload=resolve;script.onerror=reject;document.head.appendChild(script)}).catch(e=>{window.fpLeafletPromise=null;throw e});return window.fpLeafletPromise}
async function drawFootprintMap(){
 fpListRender();const el=document.getElementById('fpMap');if(!el)return;
 const groups=fpGroups();
 try{
  await fpLoadLeaflet();if(!document.getElementById('fpMap'))return;
  if(fpMap){fpMap.remove();fpMap=null;fpRouteLayer=null}el.innerHTML='';
  const map=fpMap=L.map(el,{scrollWheelZoom:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{attribution:'Tiles © Esri',maxZoom:18}).addTo(map);
  const bounds=[];
  for(const g of groups){
   const pin=L.divIcon({className:'fp-marker',html:'<span>👣<small>'+g.photos.length+'</small></span>',iconSize:[36,36],iconAnchor:[18,18]});
   L.marker([g.lat,g.lon],{icon:pin}).addTo(map).on('click',()=>fpShow(g.id));
   bounds.push([g.lat,g.lon]);
  }
  if(bounds.length)map.fitBounds(bounds,{padding:[35,35],maxZoom:12});else map.setView([0,0],2);
  fpDrawRoute(map,groups);
  map.on('zoomend',()=>{if(fpMap===map)fpDrawRoute(map,groups)});
  setTimeout(()=>{if(fpMap===map)map.invalidateSize()},200);
 }catch(e){if(document.getElementById('fpMap'))el.innerHTML='<div class="notice">지도를 불러오지 못했어요. 인터넷 연결을 확인해 주세요. 아래 장소 목록은 이용할 수 있어요.</div>'}
}
